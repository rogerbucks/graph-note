[project]
name = "graph-spec"
version = "0.2.0"
description = "Reads graph blocks in the document profile, checks them against the graph spec's rules, and lays them out with Graphviz."
license = "MIT"
requires-python = ">=3.12"
# Pinned exactly, as the JavaScript side is. Grafeo 0.5.43 is the GQL dialect the
# graph spec names; the others are needed only by the functions that use them.
dependencies = [
    "grafeo==0.5.43",
    "pyyaml==6.0.3",
    "lxml==6.1.3",
    "rfc8785==0.1.4",
]

[tool.uv]
# The modules are flat files in src/, imported by path, so there is nothing to build.
package = false

[dependency-groups]
# Ruff checks the library against PEP 8 and formats it (CONTRIBUTING.md). Pinned, as every tool is.
dev = ["ruff==0.16.9"]

[tool.ruff]
# PEP 8 lets a team agree on up to 99 characters.
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "N"]
