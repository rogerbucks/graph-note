[project]
name = "graph-spec"
version = "0.5.0"
description = "Reads graph blocks in the document profile, checks them against the graph spec's rules, and lays them out with Graphviz."
license = "MIT"
requires-python = ">=3.12"
# Pinned exactly, as the JavaScript side is; each is needed only by the functions that use it.
# A plain install reads, checks, joins and fills hashes with no engine (req:14.no-engine-install).
dependencies = [
    "pyyaml==6.0.3",
    "lxml==6.1.3",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
# The engine, for database work only: queries, path search, a graph stored to query later. Grafeo
# 0.5.43 is the GQL dialect the graph spec names, and the reference the reader is proved against.
grafeo = ["grafeo==0.5.43"]

[tool.uv]
# The modules are flat files in src/, imported by path, so there is nothing to build.
package = false
# a working copy has the tools and the reference engine; --no-default-groups is a plain install
default-groups = ["dev", "reference"]

[dependency-groups]
# Ruff checks the library against PEP 8 and formats it (CONTRIBUTING.md). Pinned, as every tool is.
dev = ["ruff==0.16.9"]
# The reference engine the tests prove the reader against (req:17.engine-agreement), a test
# dependency only; CI's python-no-engine job runs without it.
reference = ["grafeo==0.5.43"]

[tool.ruff]
# PEP 8 lets a team agree on up to 99 characters.
line-length = 99

[tool.ruff.lint]
# D1xx: every public module, class, method and function has its docstring (CONTRIBUTING.md);
# magic methods and __init__ are left to their class's
select = ["E", "W", "F", "N", "D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.per-file-ignores]
# the tests are named for what they prove: their names say it, with no docstrings
"tests/**" = ["D"]
