[package]
name = "thoughtknot-app"
version = "0.7.1"
description = "ThoughtKnot: draw, edit and keep graph notes in a plain folder, offline."
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "thoughtknot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
