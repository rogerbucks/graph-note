name: Claude review

# Claude reads every pull request and leaves a review: a summary comment, and inline comments on the lines it questions.
# It is advice, never a gate: the job is not a required check, approves nothing and changes no code. The owner is the
# only maintainer, and GitHub lets no one approve their own pull request, so this is the review a second person would give.
#
# It runs on pull_request alone, so a pull request from a fork gets no secret and no write token; it is skipped for
# forks, drafts and Dependabot, whose runs are given none of the repository's secrets anyway. The token is
# CLAUDE_CODE_OAUTH_TOKEN (made by `claude setup-token`); until it is set, the job says so in a notice and passes. The
# workflow's own token, with pull-requests: write as its one write permission, posts the comments.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# One review per pull request at a time: a newer push cancels the review of the older one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the token is set
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so no review this time"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.token.outputs.set == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a careful second maintainer. Read AGENTS.md and CONTRIBUTING.md first: the
            repository's conventions are the standard. Look for, in this order: correctness bugs; security problems
            (secrets, injection, unsafe file or network access, workflow permissions); a behaviour change with no test,
            or a test that would pass without the change; and breaks of a written convention. Say nothing about style a
            linter already checks.

            Put each finding as an inline comment on its line, saying what goes wrong and when. Then leave one summary
            comment on the pull request: the findings by severity, or that you found none. Never approve, request
            changes, push or edit files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
