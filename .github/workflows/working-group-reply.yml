name: Working group reply

# Lets Sara (Claude) answer in the pinned "Working group" discussion, #825, from any session. A cloud session cannot
# post to a discussion itself, so it starts this workflow with its reply (Roger, 21 Oct 2026). The reply is checked as
# the watcher's are (scripts/working-group.mjs): it opens "From Sara:", pings no one but Roger, stays under 400 words,
# and answers a top-level comment of #825. Then GitHub's Actions bot posts it. Only someone who can write to the
# repository can start it.
on:
  workflow_dispatch:
    inputs:
      reply_to:
        description: 'The id of the top-level comment in #825 it answers (DC_...)'
        required: true
        type: string
      body:
        description: 'The reply, opening "**From Sara:**"'
        required: true
        type: string

permissions:
  contents: read

env:
  DISCUSSION: 825

# The watcher's group: one post at a time, and none cancelled, so nothing posts twice.
concurrency:
  group: working-group
  cancel-in-progress: false

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      discussions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read the discussion's top-level comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p vet/draft
          gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$DISCUSSION" --jq .data.repository.discussion -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                discussion(number: $number) { id comments(last: 100) { nodes { id } } }
              }
            }' > vet/discussion.json
      # the reply comes in through the environment, never into a command's text
      - name: Write the reply where the checker reads it
        env:
          BODY: ${{ inputs.body }}
          REPLY_TO: ${{ inputs.reply_to }}
        run: |
          printf '%s\n' "$BODY" > vet/draft/reply.md
          printf '%s\n' "$REPLY_TO" > vet/draft/reply-to
      - name: Check the reply before it is posted
        run: node scripts/working-group.mjs check vet/discussion.json vet/draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft
          path: vet/draft/
          if-no-files-found: error

  post:
    needs: vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      discussions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft
          path: draft
      - name: Post Sara's reply under the comment it answers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$DISCUSSION" --jq .data.repository.discussion.id -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { discussion(number: $number) { id } }
            }')
          body="$(cat draft/reply.md)"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh api graphql -f discussion="$id" -f replyTo="$(cat draft/reply-to)" -f body="$body" --jq .data.addDiscussionComment.comment.url -f query='
            mutation($discussion: ID!, $replyTo: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $discussion, replyToId: $replyTo, body: $body}) {
                comment { url }
              }
            }'
