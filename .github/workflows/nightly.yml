name: Nightly

# A nightly build from main, published as a GitHub pre-release (spec §41, nightly_prerelease), for those who want the
# newest work; everyone else stays on the stable releases release.yml makes from a bare version tag. It runs at 16:00 UTC
# (2 am in Brisbane), and by hand. A night on which main has not moved since the last nightly publishes nothing.
#
# Five jobs, so no code runs beside the write. `check` asks GitHub, read only, whether main moved since the last
# nightly. `security` stops the night on an open high or critical security alert. `build` checks out main, installs and runs main's own code with read access only: the full suite, the content
# check and the build, so a nightly is published only when every test passes. It uploads the same assets a release
# carries, with the nightly version (scripts/nightly-version.mjs) in their manifest. `publish` may write the
# repository's contents, which a release needs, and so runs no code of the repository at all: no checkout, no install,
# no Node. It creates the pre-release with gh alone, and keeps the last seven nightlies. A pre-release never counts as a
# release: the build status and the wiki are woken only by a stable one (types: [released]) and leave pre-releases out.
# `drafts` runs every night, moved or not, and fails while a stable release has waited as a draft for over a day, so its
# owner hears of it (risk OPS-3; RELEASING.md, "Cutting a release").
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time, none cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      moved: ${{ steps.moved.outputs.moved }}
    steps:
      - name: Has main moved since the last nightly?
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))][0].tagName // ""')
          built=""
          if [ -n "$last" ]; then built=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish); fi
          if [ "$built" = "$sha" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Main is still at $sha, built as $last: nothing to publish."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

  # No open high or critical security alert (spec §50, security_release_gate), read with a token that may see them. A
  # medium or low one is a warning here, for a stable release stops on every alert. It installs nothing, and only reads.
  security:
    needs: check
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No high or critical security alert is open, unless the risk register accepts it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: node scripts/security-alerts.mjs --nightly

  build:
    needs: [check, security]
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # the full history: npm test runs the tests-first records test, which needs it
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/check-classification.mjs --all
      - run: npm test
      - run: npm run build
      - name: The nightly version, written into the manifest the build carries
        id: version
        run: |
          echo "version=$(node scripts/nightly-version.mjs --date "$(date -u +%Y%m%d)" --write)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bundle the core's layout source into one file, for the vault's layout parity check
        run: npm run build:layout
      - name: Archive the graph-spec libraries from the built commit, for the vault to vendor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=tar.gz -o "graph-spec-libraries-$VERSION.tar.gz" --prefix=packages/graph-spec/src/ --add-file=packages/graph-spec/dist/graph-spec-check.js --prefix=packages/core/dist/ --add-file=packages/core/dist/layout-source-node.cjs --prefix= HEAD LICENSE THIRD_PARTY_NOTICES.md packages/graph-spec/package.json packages/graph-spec/src ':(exclude)packages/graph-spec/src/graph-spec-check.js' packages/graph-spec/bin python/graph_spec/pyproject.toml python/graph_spec/uv.lock python/graph_spec/src
      # The JavaScript library as two packages, at the nightly version the manifest now carries; never to npm (Q-02)
      - name: Build the library's packages, the reader, checker and layout, and the core
        run: node scripts/library-release.mjs --out .
      - name: Checksums for every asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$VERSION.tar.gz" "thoughtknot-graph-spec-$VERSION.tgz" "thoughtknot-core-$VERSION.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: |
            main.js
            manifest.json
            styles.css
            THIRD_PARTY_NOTICES.md
            graph-spec-libraries-*.tar.gz
            thoughtknot-*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly
          path: nightly
      - name: Publish the pre-release, and keep the last seven nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}$ ]] || { echo "::error::$VERSION is not a nightly version"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$SHA is not a commit"; exit 1; }
          cd nightly
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VERSION" main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$VERSION.tar.gz" "thoughtknot-graph-spec-$VERSION.tgz" "thoughtknot-core-$VERSION.tgz" SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" --title "Nightly $VERSION" --notes "A nightly build of main at $SHA. Every test passed on it, but it has not been through a stable release's checks. For the newest work only; most people should use the latest stable release."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done

  # GitHub lists draft releases only to a token that may write contents, so this job has that and nothing else. Like
  # publish, it runs no code of the repository: no checkout, no install, no Node, only gh.
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: No stable release has waited as a draft for more than a day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt --jq '[.[] | select(.isDraft and (.createdAt | fromdateiso8601) < now - 86400) | .tagName] | join(" ")')
          if [ -n "$waiting" ]; then
            echo "::error::A draft release has waited more than a day: $waiting. Publish it, or delete it, as RELEASING.md says."
            exit 1
          fi
