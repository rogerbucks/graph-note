name: Release check (dry run)

# Run by hand, on main, before a release is tagged. It runs the checks the release waits on, step for step, as
# release.yml has them (test/quality-baseline.test.js holds the two the same): the quality metrics measured and held to
# the committed baseline, the engine's advisories, the history and a fresh clone fit to be public, and release notes that
# tell users what the library changed. So a check that would fail the release fails here first, and never costs a
# version number. It releases nothing, and only reads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # pinned, as the instruction counts are held only to counts from the same machine; and bounded, as Cachegrind is slow
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The quality metrics run the whole suite at once, twice, as the fresh clone does. That passed the default 4 GB
    # ceiling (4.2 GB, 22 Oct 2026), so it gets CI's ceiling too.
    env:
      THOUGHTKNOT_TEST_MEMORY_MB: 8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history: the suite the metrics run needs it to find each tests-first record's commit, and the
          # baseline check needs the commit before the one checked (HEAD~1) to hold the baseline against its earlier copy
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # exact, as a Node patch can move the instruction counts: changed only on purpose, with a new baseline
          node-version: 24.20.0
      - run: npm ci
      - run: npm audit signatures
      # UX-1: a person walked the build by hand, in every host and theme, and recorded it (RELEASING.md)
      - name: The accessibility walk-through of this version is recorded, every check ticked or given its reason
        run: node scripts/walkthrough-record.mjs --release
      - name: The baseline is no worse than the commit before, or every change has a reason
        run: node scripts/quality-check.mjs --baseline-since HEAD~1
      - name: Read the published advisories for the Graphviz inside the engine, and for the package that wraps it
        run: node scripts/engine-version.mjs --refresh
      - name: The engine is the version the notices name, and no advisory affects it
        run: node scripts/engine-version.mjs
      - name: Every known risk is decided, none is overdue, and none went stale since it was looked at
        run: node scripts/risk-register.mjs --release
      # Valgrind (GPL-3.0) is installed in this job alone and never shipped: licences/bundled.json, ciOnlyTools
      - name: Install Valgrind, whose Cachegrind counts the benchmarks' instructions
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Measure the quality metrics
        run: node scripts/quality-metrics.mjs --out quality/metrics.json
      - name: No metric is worse than the baseline without a recorded reason
        run: node scripts/quality-check.mjs quality/metrics.json

  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: node scripts/public-readiness.mjs --history --setup
  release-notes:
    # the notes the release writes, tried here first: they must tell users what the library changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history and tags: the changelog starts at the last release
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: The changelog since the last release, as the release writes it
        run: node scripts/changelog.mjs --out release-notes.md
      - name: The release notes tell users what the library changed, and the version rule
        run: node scripts/changelog.mjs --check release-notes.md

  # No open security alert (spec §50, security_release_gate): code scanning, Dependabot and secret scanning, read here
  # with a token that may see them, and npm audit and OSV over the lock files. An alert stops the release whatever its
  # severity, unless the risk register accepts it. It installs nothing, and only reads.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No security alert is open, unless the risk register accepts it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: node scripts/security-alerts.mjs --release
