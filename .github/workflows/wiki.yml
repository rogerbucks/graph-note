name: Wiki

# Makes the project's GitHub wiki from the repository on every push to main and every published stable release (spec §41,
# wiki_generated and user_guide_wiki): scripts/wiki-screens.mjs takes the user guide's screenshots from the build in
# the runner's Chrome, and scripts/wiki.mjs writes every page. A button of the drawing the guide does not explain is a
# warning on the run, never a failure. The developer pages (developer_wiki) describe main, the nightly build, and mark
# what is in the latest stable release apart from what is only on main, read from the requirements at that release's tag.
#
# People may edit the wiki too, and their pages are never changed here. On every run, and whenever a page is edited
# (gollum), `review` checks each page whose last change is a person's (scripts/wiki-review.mjs) and `report` keeps one
# open issue, labelled wiki-review, with the suggestions: rewritten in place, and each new list also left as a comment,
# so a person's edit to a page the wiki makes, which the next publish replaces, stays on record. Closed when nothing is left.
#
# Two jobs, so no code runs beside the write. `make` checks out main, installs and runs main's own code with read
# access only, and uploads the pages. `publish` may write the repository's contents, which is what a push to the wiki
# needs, and so runs no code of the repository at all: no checkout, no install, no Node. It downloads the pages and
# pushes them to the wiki's own repository with git alone. Nothing of a pull request ever runs here.
on:
  push:
    branches: [main]
  release:
    types: [released]
  gollum:

permissions:
  contents: read

# One wiki run at a time, none cancelled: each makes the whole wiki from main as it stands, so the newest one wins.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  make:
    if: github.event_name != 'gollum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # the whole history, so the Plan versus actual page can read the day each requirement was proved
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - name: List the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-pre-releases --json tagName,name,publishedAt > "$RUNNER_TEMP/releases.json"
      - name: Read the requirements as they stood at the latest release
        run: |
          tag=$(jq -r '[.[] | select(.tagName | test("-") | not)][0].tagName // empty' "$RUNNER_TEMP/releases.json")
          if [ -n "$tag" ]; then
            git fetch --depth=1 --no-tags origin "refs/tags/$tag"
            # the note since 19 Oct 2026, and the graph file it replaced in a release from before then
            git show FETCH_HEAD:requirements/editor-requirements.md > "$RUNNER_TEMP/released.gql" ||
              git show FETCH_HEAD:requirements/editor-requirements.gql > "$RUNNER_TEMP/released.gql"
          fi
      - name: Take the user guide's screenshots
        run: node scripts/wiki-screens.mjs --out wiki-out/images --chrome "$(command -v google-chrome)"
      - name: Write the pages
        run: node scripts/wiki.mjs --out wiki-out --sha "$GITHUB_SHA" --releases "$RUNNER_TEMP/releases.json" --released "$RUNNER_TEMP/released.gql" --labels wiki-out/images/labels.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki
          path: wiki-out
          retention-days: 1

  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - name: Check the pages people wrote or edited
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p review-out
          # GitHub makes the wiki's repository only when its first page is saved on the website
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::warning::The wiki has no pages yet, so there is nothing to review."
            : > review-out/review.md
            exit 0
          fi
          node scripts/wiki-review.mjs --wiki "$RUNNER_TEMP/wiki" --out review-out/review.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-review
          path: review-out
          retention-days: 1

  report:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-review
          path: review-out
      - name: Keep the wiki-review issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=review-out/review.md
          number=$(gh issue list --label wiki-review --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ ! -s "$body" ]; then
            [ -n "$number" ] && gh issue close "$number" --comment "Nothing left to suggest: every page people edited passes the checks."
            exit 0
          fi
          gh label create wiki-review --description "Suggestions for wiki pages people edited" --color c5def5 2>/dev/null || true
          if [ -z "$number" ]; then
            gh issue create --title "Wiki review: suggestions for pages people edited" --label wiki-review --body-file "$body"
          elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat "$body")" ]; then
            gh issue edit "$number" --body-file "$body"
            gh issue comment "$number" --body-file "$body"
          fi

  publish:
    if: github.event_name != 'gollum'
    needs: [make, review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki
          path: wiki-out
      - name: Push the pages to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo || {
            echo "::error::The wiki has no pages yet. Save its first page once on GitHub (any text), then re-run this workflow."
            exit 1
          }
          rsync -a --exclude .git --exclude images/labels.json wiki-out/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "The wiki is already current."; exit 0; }
          git commit -q -m "Update the wiki from ${GITHUB_SHA::7}"
          git push
