name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/check-classification.mjs --all
      - run: npm test
      - run: npm run build
      - name: The tag matches the manifest version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - name: Archive the graph-spec libraries from the tagged commit, for the vault to vendor
        run: git archive --format=tar.gz -o "graph-spec-libraries-$GITHUB_REF_NAME.tar.gz" HEAD LICENSE THIRD_PARTY_NOTICES.md packages/graph-spec/package.json packages/graph-spec/src packages/graph-spec/bin python/graph_spec/pyproject.toml python/graph_spec/uv.lock python/graph_spec/src
      - name: Checksums for every asset
        run: sha256sum main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS
      # GitHub keeps attestations only for public repositories owned by a person; while private, SHA256SUMS stands in.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            graph-spec-libraries-*.tar.gz
      - name: Draft the release with the store assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$GITHUB_REF_NAME.tar.gz" SHA256SUMS --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
