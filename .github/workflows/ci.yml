name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the record of tests seen failing first is checked against the history it was made from
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/check-classification.mjs --all
      # the quick quality metrics (file sizes, secrets) against the baseline; the slow ones are the release's
      - run: node scripts/quality-check.mjs --fast
      # a baseline committed worse than the base's needs a reason in quality/accepted.json, as a measured run does
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-check.mjs --baseline-since "$BASE"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: npm run format:check
      - run: npm run lint

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/graph_spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The parity test reads the shared cases through Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked python -m unittest discover -s tests

  # Every test is seen to fail before its code (spec §12): each new commit is replayed, its tests run against its
  # parent's code, and a new test that passes there fails the build unless test/seen-failing.json gives the reason.
  tests-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: uv sync --locked
        working-directory: python/graph_spec
      - name: Replay each new commit's tests against its parent's code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -n "$commits" ]; then node scripts/tests-first.mjs --check $commits; fi
