name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One run for each pull request: a newer push cancels the run of the older commit, which can no longer be merged (the
# Build status workflow skips such a run as stale). A push to main is never cancelled, so every merge is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite, its test files split over six machines that run at once, so a run takes about a minute, not five. Each
  # prints only its failures; the full report of a failed one is kept as the run's artifact. The test job below stands
  # for them all as one required check.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the record of tests seen failing first is checked against the history it was made from
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # the lint job verifies the signatures of this same locked install
      - run: npm ci
      # six files at once on the runner's four cores, as the files mostly wait on the processes they start
      - env:
          SHARD: ${{ matrix.shard }}
        run: npm test -- --test-concurrency=6 --test-shard="$SHARD/6" --test-reporter=./scripts/quiet-reporter.mjs --test-reporter-destination=stdout --test-reporter=spec --test-reporter-destination=test-report.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.shard }}
          path: test-report.txt
          retention-days: 7

  # Passes when every part of the suite passed: the one check the default branch requires for them.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: suite
    if: always()
    steps:
      - env:
          RESULT: ${{ needs.suite.result }}
        run: test "$RESULT" = success

  # The quick checks: format, lint, content, quality baseline, types, the requirements' flips and the build.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the quality baseline and the requirements' flips are compared with the base of the change
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: npm run format:check
      - run: npm run lint
      - run: node scripts/check-classification.mjs --all
      # the quick quality metrics (file sizes, secrets) against the baseline; the slow ones are the release's
      - run: node scripts/quality-check.mjs --fast
      # a baseline committed worse than the base's needs a reason in quality/accepted.json, as a measured run does
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-check.mjs --baseline-since "$BASE"
      - run: npm run typecheck
      # the requirements graph is edited here, but a pull request never moves a test back or removes a proved one
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # against the merge base, so a change main gained after the branch point is not read as a hand revert
        run: node scripts/check-requirements-flips.mjs --merge-base-of "$BASE"
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python/graph_spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The parity tests read the shared cases through Node, and run the core's reader, which needs the packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      # a working copy has the reference engine, Grafeo: every test that needs it runs here, and fails if it is missing
      - run: node ../../scripts/run-ceiling.mjs uv run --locked python -m unittest discover -s tests
        env:
          GRAPH_SPEC_ENGINE: required

  # A plain install, with Grafeo not installed (req:14.no-engine-install): reading, checking, joining and drawing pass
  # without it; only the tests that need the engine are skipped.
  python-no-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python/graph_spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The parity tests read the shared cases through Node, and run the core's reader, which needs the packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: uv sync --locked --no-default-groups
      - name: Grafeo is not installed
        run: "! uv run --locked --no-default-groups python -c 'import grafeo'"
      - run: node ../../scripts/run-ceiling.mjs uv run --locked --no-default-groups python -m unittest discover -s tests

  # Every test is seen to fail before its code (spec §12): each new commit is replayed, its tests run against its
  # parent's code, and a new test that passes there fails the build unless its reason is kept in test/seen-failing/.
  # It reads only that folder, never the record in test/tests-first/, so the record cannot weaken it.
  tests-first:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - run: uv sync --locked
        working-directory: python/graph_spec
      - name: Replay each new commit's tests against its parent's code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -n "$commits" ]; then node scripts/tests-first.mjs --check $commits; fi
      # every commit since the baseline that changed a test has its record, written on its own branch
      - name: Every commit that changed a test is recorded
        run: node scripts/tests-first.mjs --complete

  # Fit to be public, and kept so (spec §13): no secret and nothing confidential or personal in any commit of the
  # checked-out history (HEAD: main and the pull request's own commits, not another branch's, such as a bot's), every
  # commit from a no-reply address, and a stranger's fresh clone sets up and builds from the README's steps alone. The
  # full depth gives HEAD its whole history. The clone runs the steps for real, so the job needs what the README asks
  # for: Node and uv.
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      # The fresh clone runs the same tests, lint and build as the jobs above, so a pull request runs it only when it
      # changes a setup input (the README's steps, what they install, the hook); a push to main and the release always do.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/public-readiness.mjs --history --setup-since "$BASE"
      - if: github.event_name != 'pull_request'
        run: node scripts/public-readiness.mjs --history --setup
