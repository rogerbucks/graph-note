name: Desktop app

# The desktop app (spec §41, standalone_app), built for real on Linux, macOS and Windows, with its Rust tests. On Linux
# it is also run on a folder of notes and driven as a person uses it (test/standalone-app.test.js), under a virtual
# display. tauri-driver has no macOS driver, so the other two are built and tested, not driven. Each system also builds
# its installer, kept as a download of the run.
# It runs when the app, the editor page it carries, or the core beneath them changes.
on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - 'test/standalone-app.test.js'
      - '.github/workflows/desktop-app.yml'
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - 'test/standalone-app.test.js'
      - '.github/workflows/desktop-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # the window's files, which the Rust build takes in whole
      - run: npm run build --workspace packages/app
      # WebKitGTK, which Tauri builds against on Linux; the driver and a display only to drive it
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb
      - working-directory: packages/app/src-tauri
        run: cargo test --locked
      - working-directory: packages/app/src-tauri
        run: cargo build --locked
      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked --version 2.1.0
      # missing app, driver or display fails here, never skips
      - if: runner.os == 'Linux'
        env:
          THOUGHTKNOT_APP_REQUIRED: 1
        run: xvfb-run -a npm run test:ai -- test/standalone-app.test.js
      # the installers, unsigned for now: a .dmg on macOS, an NSIS installer on Windows and a .deb on Linux. The .deb
      # uses the system's own WebKitGTK and carries none of it (licences/bundled.json, desktopBuildLibraries).
      - run: cargo install tauri-cli --locked --version 2.12.4
      - working-directory: packages/app/src-tauri
        run: cargo tauri build --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoughtknot-app-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/app/src-tauri/target/release/bundle/dmg/*.dmg
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
            packages/app/src-tauri/target/release/bundle/deb/*.deb
