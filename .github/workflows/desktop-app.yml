name: Desktop app

# The desktop app (spec §41, standalone_app), built for real on Linux, macOS and Windows, with its Rust tests. On Linux
# it is also run on a folder of notes and driven as a person uses it (test/standalone-app.test.js), under a virtual
# display. tauri-driver has no macOS driver, so the other two are built and tested, not driven. Each system also builds
# its installer, kept as a download of the run.
# It runs when the app, the editor page it carries, or the core beneath them changes. The nightly also calls it, at the
# commit it built, and carries the installers in its pre-release (nightly.yml, desktop).
on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - 'test/standalone-app.test.js'
      - 'scripts/desktop-build.mjs'
      - '.github/workflows/desktop-app.yml'
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - 'test/standalone-app.test.js'
      - 'scripts/desktop-build.mjs'
      - '.github/workflows/desktop-app.yml'
  workflow_dispatch:
  # the nightly, at the commit it built, with the signing keys handed one by one
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
    secrets:
      APPLE_CERTIFICATE:
      APPLE_CERTIFICATE_PASSWORD:
      APPLE_SIGNING_IDENTITY:
      APPLE_API_ISSUER:
      APPLE_API_KEY:
      APPLE_API_PRIVATE_KEY:
      LINUX_GPG_PRIVATE_KEY:
      LINUX_GPG_PASSPHRASE:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the nightly's commit when it calls; else the commit that woke the run
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # the window's files, which the Rust build takes in whole
      - run: npm run build --workspace packages/app
      # WebKitGTK, which Tauri builds against on Linux; the driver and a display only to drive it
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb
      - working-directory: packages/app/src-tauri
        run: cargo test --locked
      - working-directory: packages/app/src-tauri
        run: cargo build --locked
      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked --version 2.1.0
      # missing app, driver or display fails here, never skips
      - if: runner.os == 'Linux'
        env:
          THOUGHTKNOT_APP_REQUIRED: 1
        run: xvfb-run -a npm run test:ai -- test/standalone-app.test.js
      # the installers: a .dmg on macOS, an NSIS installer on Windows and a .deb on Linux. The .deb uses the system's
      # own WebKitGTK and carries none of it (licences/bundled.json, desktopBuildLibraries).
      - run: cargo install tauri-cli --locked --version 2.12.4
      # Signed only off pull requests, where each system signs when all its keys are set (docs/app-signing.md). A
      # pull request's code could read the keys, so it builds unsigned and gets none. Windows is not signed (Roger,
      # 23 Oct 2026).
      - if: github.event_name == 'pull_request'
        run: node scripts/desktop-build.mjs
      - if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: node scripts/desktop-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoughtknot-app-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/app/src-tauri/target/release/bundle/dmg/*.dmg
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
            packages/app/src-tauri/target/release/bundle/deb/*.deb
            packages/app/src-tauri/target/release/bundle/deb/*.deb.asc
