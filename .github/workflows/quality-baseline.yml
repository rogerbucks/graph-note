name: Quality baseline

# Run by hand. Measures the quality metrics on the CI runner (Linux, Node 24) and uploads the result, so it can be
# committed as quality/baseline.json by a normal pull request. The benchmarks' instruction counts are held only against
# counts from the same machine; until then they warn. A benchmark whose fingerprint (its bundle, the machine, Node and
# Valgrind) is the same as in the committed baseline keeps its count there, uncounted, unless every one is asked for.
# Asked, it also counts the benchmarks three times over, so the spread between runs, which the instruction counts'
# tolerance must be wider than, is measured where they are. The job only reads.
on:
  workflow_dispatch:
    inputs:
      count_all:
        description: Count every benchmark, keeping no count from the baseline
        type: boolean
        default: false
      spread:
        description: Also count every benchmark three times over, for the spread between runs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    # pinned, as the instruction counts are held only to counts from the same machine; and bounded, as Cachegrind is slow
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history: the suite the metrics run needs it to find each tests-first record's commit
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # exact, as a Node patch can move the instruction counts: changed only on purpose, with a new baseline
          node-version: 24.20.0
      - run: npm ci
      - run: npm audit signatures
      # Valgrind (GPL-3.0) is installed in this job alone and never shipped: licences/bundled.json, ciOnlyTools
      - name: Install Valgrind, whose Cachegrind counts the benchmarks' instructions
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Measure, keeping the count of each benchmark that has not changed since the baseline
        if: ${{ !inputs.count_all }}
        run: node scripts/quality-metrics.mjs --out quality/metrics.json --reuse quality/baseline.json
      - name: Measure, counting every benchmark
        if: ${{ inputs.count_all }}
        run: node scripts/quality-metrics.mjs --out quality/metrics.json
      - name: Count the benchmarks three times, for the spread between runs
        if: ${{ inputs.spread }}
        run: node scripts/instruction-counts.mjs --runs 3 --out quality/instruction-spread.json
      # printed as well as uploaded, so the counts can be read from the job's log where the artifact cannot be fetched
      - name: Print what was measured
        if: always()
        run: cat quality/metrics.json quality/instruction-spread.json || true
      # uploaded whatever the steps before gave, so a failed count still leaves what it measured
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-metrics
          path: |
            quality/metrics.json
            quality/instruction-spread.json
