name: Quality baseline

# Run by hand. Measures the quality metrics on the CI runner (Linux, Node 24) and uploads the result, so it can be
# committed as quality/baseline.json by a normal pull request. Timings are only held against a baseline measured on the
# same operating system and Node major; until then they warn. The job only reads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/quality-metrics.mjs --out quality/metrics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-metrics
          path: quality/metrics.json
